<main>
        <section class="pagina-titulo-section">
  <div class="pagina-titulo-texto">
      <h1>Seja um Voluntário</h1>
  </div>
</section>

<section class="conteudo-principal">
  <div class="container">
      
      <form class="form-cadastro" [formGroup]="formCadastro" (ngSubmit)="onSubmit()">
          <h2>Preencha seus dados</h2>
          <p>Faça parte da nossa equipe e ajude a construir um futuro brilhante!</p>
          
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" formControlName="nome">
          <div *ngIf="formCadastro.get('nome')?.invalid && formCadastro.get('nome')?.touched" class="mensagem-erro-angular">
              Nome é obrigatório.
          </div>

          <label for="email">E-mail</label>
          <input type="email" id="email" formControlName="email">
          <div *ngIf="formCadastro.get('email')?.invalid && formCadastro.get('email')?.touched" class="mensagem-erro-angular">
              Por favor, insira um e-mail válido.
          </div>
          
          <label for="telefone">Telefone (somente números)</label>
          <input type="tel" id="telefone" formControlName="telefone">
          <div *ngIf="formCadastro.get('telefone')?.invalid && formCadastro.get('telefone')?.touched" class="mensagem-erro-angular">
              Telefone inválido (deve ter 10 ou 11 números).
          </div>

          <label for="cpf">CPF (somente números)</label>
          <input type="text" id="cpf" formControlName="cpf" maxlength="11">
          <div *ngIf="formCadastro.get('cpf')?.invalid && formCadastro.get('cpf')?.touched" class="mensagem-erro-angular">
              CPF inválido.
          </div>

          <label for="mensagem">Por que você quer ser voluntário?</label>
          <textarea id="mensagem" formControlName="mensagem" rows="5"></textarea>

          <button type="submit" [disabled]="formCadastro.invalid">Enviar Cadastro</button>
      </form>
  </div>
</section>
    </main>
