<main>
        <section class="pagina-titulo-section">
            <div class="pagina-titulo-texto">
                <h1>Seja um Voluntário</h1>
            </div>
        </section>

        <section class="conteudo-principal">
            <div class="container">
                <form class="form-cadastro">
                    <h2>Preencha seus dados</h2>
                    <p>Faça parte da nossa equipe e ajude a construir um futuro brilhante!</p>
                    
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                    <p class="mensagem-erro" id="erro-email"></p>
                    
                    <label for="telefone">Telefone (somente números)</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="11999998888" required maxlength="11">
                    <p class="mensagem-erro" id="erro-telefone"></p>

                    <label for="cpf">CPF (somente números)</label>
                    <input type="text" id="cpf" name="cpf" placeholder="12345678900" required maxlength="11">
                    <p class="mensagem-erro" id="erro-cpf"></p>

                    <label for="mensagem">Por que você quer ser voluntário?</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

                    <button type="submit">Enviar Cadastro</button>
                </form>
            </div>
        </section>
    </main>
